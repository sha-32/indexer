[package]
name = "indexer"
version = "0.1.0"
edition = "2024"
description = "A typed query language for filtering and sorting collections of rows"
license = "Apache-2.0"

[features]
default = ["sqlite", "postgres", "mysql", "duckdb", "mssql", "clickhouse", "bigquery", "elastic", "mongodb"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:postgres"]
mysql = ["dep:mysql"]
duckdb = ["dep:duckdb"]
mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util"]
clickhouse = ["dep:ureq"]
bigquery = ["dep:ureq"]
elastic = ["dep:ureq"]
mongodb = ["dep:mongodb"]

[dependencies]
base64 = "0.23.1"
duckdb = { version = "1.10506.0", features = ["bundled"], optional = true }
mongodb = { version = "3.9.1", features = ["sync"], optional = true }
mysql = { version = "28.0.3", optional = true }
postgres = { version = "0.19.14", optional = true }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"], optional = true }
serde_json = { version = "1.0.152", features = ["preserve_order"] }
tiberius = { version = "0.13.0", optional = true }
tokio = { version = "1.53.2", features = ["rt", "net"], optional = true }
tokio-util = { version = "0.7.20", features = ["compat"], optional = true }
ureq = { version = "3.4.2", optional = true }

[dev-dependencies]
axum = "0.8.9"
base64 = "0.23.1"
duckdb = "1.10506.0"
mongodb = { version = "3.9.1", features = ["sync"] }
mysql = "28.0.3"
postgres = "0.19.14"
rusqlite = "0.40.2"
serde_json = "1.0.152"
tiberius = "0.13.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net"] }
